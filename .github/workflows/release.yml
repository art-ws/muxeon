name: Release

# Manual-only release. There is NO push/tag trigger: every `npm publish` happens
# solely on an operator-initiated workflow_dispatch. `dry_run: true` computes the
# next version + changelog with no tag / GitHub Release / publish side effects —
# run that first, always.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute next version + changelog preview, no tag/release/publish"
        type: boolean
        default: true

permissions:
  contents: write # semantic-release commits CHANGELOG + version bump and creates the tag/release
  id-token: write # REQUIRED: npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: semantic-release analyzes commits since the last tag

      # Two runtimes on purpose: bun builds the artifact (this is a Bun project),
      # node runs semantic-release, which is a Node tool.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - uses: actions/setup-node@v4
        with:
          # semantic-release needs Node >=22.14 || >=24.10; trusted publishing
          # needs >=22.14 too. This is the CI runner only — the published shim
          # supports Node >=20 (package.json "engines"), which ci.yml exercises.
          node-version: 24
          registry-url: "https://registry.npmjs.org" # required for OIDC
          # No `cache:` on purpose — a release build must not restore a cache.

      # Trusted publishing needs npm CLI >=11.5.1. Node 24 ships an 11.x npm, but
      # pin it explicitly so a runner image change cannot silently drop OIDC back
      # to token auth (which would then fail, since no NPM_TOKEN exists).
      - name: Ensure an OIDC-capable npm
        run: |
          npm install -g npm@^11
          npm --version

      - run: bun install --frozen-lockfile

      # Build BEFORE publish: dist/ must exist (and carry the panel) before
      # @semantic-release/npm packs the tarball. `files` ships bin/ + dist/ only.
      - run: bun run build:dist

      - name: Verify the packed artifact
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/ui/index.html

      # NPM_TOKEN is TEMPORARY and exists for exactly one release — the first
      # publish of `muxeon`. npm cannot configure a trusted publisher for a
      # package that does not exist yet (the setting lives on the package's own
      # settings page, npm/cli#8544), so the first version cannot come from OIDC.
      # Provenance is unaffected: the SLSA attestation is produced by the cloud
      # runner, not by the auth method, and npm's own docs publish with a token.
      # Publishing this from a laptop instead WOULD lose the badge, permanently
      # for that version — attestations cannot be added after the fact.
      #
      # AFTER the first release: configure the trusted publisher on npmjs.com —
      # it must name THIS repository and THIS workflow file (release.yml)
      # exactly, the filename is part of the match — then delete the NPM_TOKEN
      # secret and this env line. @semantic-release/npm (>=13) then detects the
      # Actions OIDC context and exchanges it for a short-lived credential, so
      # there is no long-lived secret to store or rotate. It falls back to token
      # auth when no OIDC context is established — so an EINVALIDNPMTOKEN failure
      # once the token is gone means the trusted publisher did not match, NOT a
      # missing secret.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # BOTH names are required, and NODE_AUTH_TOKEN is the one npm actually
          # reads here: setup-node's `registry-url` writes an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}` and points NPM_CONFIG_USERCONFIG at
          # it. Because that file already declares auth, @semantic-release/npm
          # leaves it alone instead of injecting NPM_TOKEN — so with NPM_TOKEN
          # set alone, npm authenticates with setup-node's literal placeholder
          # (`XXXXX-XXXXX-XXXXX-XXXXX`) and the registry answers 401, which
          # surfaces as the misleading `EINVALIDNPMTOKEN Invalid npm token`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # temporary — remove with the trusted publisher (C1a)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # temporary — remove with the trusted publisher (C1a)
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
