# Toolchain gate: typecheck + lint + test + build on every push and pull request.
# Publish is NOT here — releases are manual, see release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite spawns tmux sessions and binds loopback ports; a wedged test would
    # otherwise sit here until GitHub's 6h ceiling. Fail in minutes instead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      # tmux integration tests need a tmux binary; without one they skip.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # `package.json` is exempt from the FORMATTER (biome.json overrides): the
      # release job rewrites it through @semantic-release/npm, whose JSON style is
      # npm's, not ours — and it commits with [skip ci], so the breakage would only
      # surface on the next unrelated PR. Linting still applies to everything else.
      - run: bun run lint

      # The SPA-serving test exercises the REAL built panel bundle — build it
      # first (locally dist/ always exists; CI starts clean).
      - name: Build panel bundle
        run: bun run build:ui

      # `bun run test`, not `bun test` — the script carries --timeout 30000. The
      # 5s default is below what the tmux/HTTP integration tests legitimately
      # need, and a test killed mid-flight leaks its server and wedges the run.
      - name: Test
        timeout-minutes: 15
        run: bun run test

      # Build exactly what `npm publish` would ship, and assert the two files the
      # package is useless without: the server bundle and the panel it serves.
      - name: Build publishable dist
        run: bun run build:dist

      - name: Verify the packed artifact
        run: |
          npm pack --dry-run
          test -f dist/index.js
          test -f dist/ui/index.html

  secretlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - run: bun install --frozen-lockfile
      # Scans the working tree for secret VALUES; fails the build on any finding.
      - run: bun run secretlint
